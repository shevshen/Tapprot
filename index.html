<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapprot</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mystic: ['Cinzel', 'serif'] },
                    colors: {
                        obsidian: '#0b0d14',
                        midnight: '#131622',
                        cardbg: '#1a1e2e',
                        gold: { 400: '#e5c158', 500: '#d4af37', 600: '#b59224' },
                        mystic: { 500: '#7c3aed', 600: '#6d28d9' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0d14; color: #e2e8f0; min-height: 100vh; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0d14; }
        ::-webkit-scrollbar-thumb { background: #2d334d; border-radius: 9999px; }
        .card-art-wrapper { transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .is-reversed .card-art-wrapper { transform: rotate(180deg); }
        .prose-tarot h1, .prose-tarot h2, .prose-tarot h3 { font-family: 'Cinzel', serif; color: #e5c158; margin-top: 1.5rem; margin-bottom: 0.75rem; font-weight: 700; }
        .prose-tarot h2 { font-size: 1.25rem; border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 0.35rem; }
        .prose-tarot p { margin-bottom: 1rem; line-height: 1.75; color: #cbd5e1; }
        .prose-tarot strong { color: #f8fafc; font-weight: 600; }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); transform: scale(1); }
            50% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.5); transform: scale(1.04); }
        }
        .mystic-loader { animation: pulseGlow 2.5s infinite ease-in-out; }
    </style>
</head>
<body class="antialiased">

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4"></div>

    <header class="sticky top-0 z-30 backdrop-blur-md bg-obsidian/80 border-b border-slate-800">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://i.ibb.co/hFYRKMpw/journal-stickers-removebg-preview.png" alt="Logo" class="w-10 h-10 rounded-xl object-cover border border-gold-500/40 shadow-lg">
                <h1 class="font-mystic text-lg font-bold text-slate-100">Tapprot</h1>
            </div>
            <div class="flex items-center gap-2">
                <span id="api-status-badge" onclick="openSettings()" class="cursor-pointer text-xs px-2.5 py-1.5 rounded-lg border flex items-center gap-1.5 bg-obsidian border-slate-700 text-slate-300">
                    <span class="w-2 h-2 rounded-full bg-rose-500" id="api-status-dot"></span>
                    <span id="api-status-text">API Ayarla</span>
                </span>
                <button onclick="openSettings()" class="p-2.5 rounded-xl bg-cardbg border border-slate-700 text-slate-300 hover:text-gold-400">⚙</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6 pb-20">
        <!-- ADIM 1 -->
        <section class="bg-midnight/90 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <div class="flex items-center gap-2.5 mb-4">
                <span class="w-7 h-7 rounded-lg bg-gold-500/15 border border-gold-500/30 text-gold-400 font-bold text-sm flex items-center justify-center">1</span>
                <h2 class="font-mystic text-base font-semibold text-slate-100">Niyetin</h2>
            </div>
            <textarea id="intention-input" rows="2" placeholder="Niyetiniz veya sorunuz..." class="w-full bg-obsidian border border-slate-700 rounded-xl p-3 text-sm text-slate-100 outline-none"></textarea>
            <div class="mt-4 flex flex-wrap gap-2" id="spread-count-buttons"></div>
        </section>

        <!-- ADIM 2 -->
        <section class="bg-midnight/90 border border-slate-800 rounded-2xl p-5 shadow-xl relative overflow-hidden">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2.5">
                    <span class="w-7 h-7 rounded-lg bg-gold-500/15 border border-gold-500/30 text-gold-400 font-bold text-sm flex items-center justify-center">2</span>
                    <h2 class="font-mystic text-base font-semibold text-slate-100">Açılan Kartlar (<span id="selection-counter">0 / 3</span>)</h2>
                </div>
                <button onclick="clearSelectedCards()" class="text-xs text-rose-400 hover:underline">Masayı Temizle</button>
            </div>
            <div id="selected-cards-container" class="flex flex-wrap gap-4 justify-center py-2"></div>
        </section>

        <button onclick="requestTarotReading()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-gold-600 via-gold-500 to-amber-500 text-obsidian font-mystic font-bold text-base shadow-lg cursor-pointer">
            HAZIRIM — KARTLARI YORUMLA
        </button>

        <!-- ADIM 3 -->
        <section class="bg-midnight/90 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <div class="flex items-center gap-2.5 mb-4">
                <span class="w-7 h-7 rounded-lg bg-gold-500/15 border border-gold-500/30 text-gold-400 font-bold text-sm flex items-center justify-center">3</span>
                <h2 class="font-mystic text-base font-semibold text-slate-100">78 Kartlık Deste</h2>
            </div>
            <input type="text" id="card-search-input" oninput="filterDeck()" placeholder="Kart ara..." class="w-full bg-obsidian border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 mb-3 outline-none">
            <div class="flex gap-2 overflow-x-auto pb-2" id="category-tabs"></div>
            <div id="deck-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-4 max-h-[500px] overflow-y-auto pr-1"></div>
        </section>

        <!-- YÜKLENİYOR VE SONUÇ -->
        <div id="loading-panel" class="hidden bg-midnight border border-gold-500/30 rounded-2xl p-8 text-center space-y-3">
            <div class="w-12 h-12 mx-auto rounded-full border-2 border-gold-400 border-t-transparent animate-spin"></div>
            <h3 class="font-mystic text-gold-400 font-semibold">Kartlar Okunuyor...</h3>
        </div>

        <div id="result-panel" class="hidden bg-midnight border border-gold-500/40 rounded-2xl p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="font-mystic text-lg font-bold text-gold-400">Tarot Yorumun</h2>
                <button onclick="copyReading()" class="text-xs px-3 py-1.5 rounded-lg bg-cardbg border border-slate-700 text-slate-200">Yorumu Kopyala</button>
            </div>
            <div id="reading-output" class="prose-tarot text-sm sm:text-base"></div>
        </div>
    </main>

    <!-- AYARLAR MODALI -->
    <div id="settings-modal" class="fixed inset-0 hidden bg-black/75 flex items-center justify-center p-4 z-50">
        <div class="bg-midnight border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4">
            <h3 class="font-mystic font-bold text-gold-400">Gemini API Ayarları</h3>
            <div>
                <label class="block text-xs text-slate-400 mb-1">API Anahtarınız (AQ... veya AIza...)</label>
                <input type="password" id="api-key-input" placeholder="Anahtarınızı buraya yapıştırın..." class="w-full bg-obsidian border border-slate-700 rounded-xl p-3 text-sm text-slate-100 outline-none">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeSettings()" class="px-4 py-2 text-xs text-slate-300">Vazgeç</button>
                <button onclick="saveSettings()" class="px-4 py-2 text-xs bg-gold-500 text-obsidian font-bold rounded-xl">Kaydet</button>
            </div>
        </div>
    </div>

        let state = { targetCount: 3, selectedCards: [], activeCategory: 'ALL', searchQuery: '', lastRawMarkdown: '' };

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_tarot_api_key') || '';
            document.getElementById('api-key-input').value = savedKey;
            updateStatus(savedKey);
            renderSpreadButtons();
            renderCategoryTabs();
            renderSelectedCards();
            renderDeck();
        });

        function updateStatus(key) {
            const dot = document.getElementById('api-status-dot');
            const txt = document.getElementById('api-status-text');
            if(key.length > 5) {
                dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
                txt.textContent = 'API Hazır';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-rose-500';
                txt.textContent = 'API Ayarla';
            }
        }

        function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }
        function saveSettings() {
            const key = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('gemini_tarot_api_key', key);
            updateStatus(key);
            closeSettings();
        }

        function renderSpreadButtons() {
            document.getElementById('spread-count-buttons').innerHTML = SPREAD_OPTIONS.map(n => 
                `<button onclick="state.targetCount=${n}; renderSelectedCards(); renderSpreadButtons();" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold border ${state.targetCount === n ? 'bg-gold-500 text-obsidian border-gold-400' : 'bg-obsidian border-slate-700 text-slate-300'}">${n} Kart</button>`
            ).join('');
        }

        function renderCategoryTabs() {
            document.getElementById('category-tabs').innerHTML = CATEGORIES.map(cat => 
                `<button onclick="state.activeCategory='${cat.id}'; renderCategoryTabs(); renderDeck();" class="whitespace-nowrap px-3 py-1.5 rounded-xl text-xs border ${state.activeCategory === cat.id ? 'bg-mystic-600/30 border-mystic-500 text-purple-200' : 'bg-obsidian border-slate-800 text-slate-400'}">${cat.label}</button>`
            ).join('');
        }

        function filterDeck() {
            state.searchQuery = document.getElementById('card-search-input').value.trim().toLowerCase();
            renderDeck();
        }

        function renderDeck() {
            const grid = document.getElementById('deck-grid');
            const filtered = TAROT_DECK.filter(c => {
                const matchCat = state.activeCategory === 'ALL' || c.category === state.activeCategory;
                const matchSearch = !state.searchQuery || c.name.toLowerCase().includes(state.searchQuery);
                return matchCat && matchSearch;
            });

            grid.innerHTML = filtered.map(c => {
                const isSelected = state.selectedCards.some(sc => sc.cardId === c.id);
                return `
                    <button onclick="addCard('${c.id}')" class="p-3 rounded-xl border flex flex-col justify-between text-left transition ${isSelected ? 'bg-gold-500/15 border-gold-500/60' : 'bg-obsidian border-slate-800 hover:border-gold-500/40'}">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold text-slate-200 truncate">${c.name}</span>
                            <span class="text-xs ${isSelected ? 'text-gold-400 font-bold' : 'text-slate-500'}">${isSelected ? '✓' : '+'}</span>
                        </div>
                        <div class="w-full aspect-[2/3] rounded-lg bg-slate-900 overflow-hidden flex items-center justify-center">
                            ${c.image ? `<img src="${c.image}" class="w-full h-full object-cover">` : `<span class="text-xl">${c.symbol}</span>`}
                        </div>
                    </button>
                `;
            }).join('');
        }

        function addCard(id) {
            if(state.selectedCards.length >= state.targetCount) return;
            const c = TAROT_DECK.find(x => x.id === id);
            if(c && !state.selectedCards.some(sc => sc.cardId === id)) {
                state.selectedCards.push({ uid: Math.random(), cardId: c.id, name: c.name, symbol: c.symbol, image: c.image, isReversed: false });
                renderSelectedCards();
                renderDeck();
            }
        }

        function removeCard(uid) {
            state.selectedCards = state.selectedCards.filter(sc => sc.uid !== uid);
            renderSelectedCards();
            renderDeck();
        }

        function toggleReverse(uid) {
            const sc = state.selectedCards.find(x => x.uid === uid);
            if(sc) { sc.isReversed = !sc.isReversed; renderSelectedCards(); }
        }

        function clearSelectedCards() {
            state.selectedCards = [];
            renderSelectedCards();
            renderDeck();
        }

        function renderSelectedCards() {
            const container = document.getElementById('selected-cards-container');
            document.getElementById('selection-counter').textContent = `${state.selectedCards.length} / ${state.targetCount}`;
            
            let html = '';
            for(let i=0; i<state.targetCount; i++) {
                const sc = state.selectedCards[i];
                if(!sc) {
                    html += `<div class="w-32 h-48 border-2 border-dashed border-slate-800 rounded-xl flex items-center justify-center text-xs text-slate-600">${i+1}. Kart</div>`;
                } else {
                    html += `
                        <div class="w-36 bg-cardbg border ${sc.isReversed ? 'border-amber-500/50 is-reversed' : 'border-gold-500/40'} rounded-xl p-2.5 flex flex-col justify-between shadow-lg">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[10px] font-bold text-gold-400">#${i+1}</span>
                                <button onclick="removeCard(${sc.uid})" class="text-xs text-slate-400 hover:text-rose-400">✕</button>
                            </div>
                            <div class="text-center font-bold text-xs truncate mb-1 text-slate-200">${sc.name}</div>
                            <div onclick="toggleReverse(${sc.uid})" class="cursor-pointer w-full aspect-[2/3] rounded-lg bg-obsidian overflow-hidden flex items-center justify-center relative">
                                <div class="card-art-wrapper w-full h-full flex items-center justify-center">
                                    ${sc.image ? `<img src="${sc.image}" class="w-full h-full object-cover">` : sc.symbol}
                                </div>
                            </div>
                            <div class="mt-2 flex justify-between items-center text-[10px]">
                                <span class="${sc.isReversed ? 'text-amber-400' : 'text-emerald-400'} font-bold">${sc.isReversed ? 'TERS' : 'DÜZ'}</span>
                                <button onclick="toggleReverse(${sc.uid})" class="underline text-slate-400 hover:text-white">Çevir</button>
                            </div>
                        </div>
                    `;
                }
            }
            container.innerHTML = html;
        }

        async function requestTarotReading() {
            const apiKey = localStorage.getItem('gemini_tarot_api_key')?.trim();
            if(!apiKey) { alert('Lütfen Ayarlar kısmından API anahtarınızı girin!'); openSettings(); return; }
            
            const intention = document.getElementById('intention-input').value.trim();
            if(!intention) { alert('Lütfen niyetinizi yazın.'); return; }
            if(state.selectedCards.length === 0) { alert('Lütfen en az bir kart seçin.'); return; }

            const loading = document.getElementById('loading-panel');
            const result = document.getElementById('result-panel');
            loading.classList.remove('hidden');
            result.classList.add('hidden');
            loading.scrollIntoView({ behavior: 'smooth' });

            const cardsText = state.selectedCards.map((sc, idx) => `${idx+1}. Kart: ${sc.name} (${sc.isReversed ? 'Ters' : 'Düz'})`).join('\n');
            const prompt = `Niyetim: "${intention}"\nÇektiğim Kartlar:\n${cardsText}\nLütfen bu kartları niyetim doğrultusunda element dengeleri ve kombinasyonlarıyla dürüstçe yorumla.`;

            try {
                // CORS engeline takılmamak için ücretsiz proxy köprüsü kullanıldı
                const targetUrl = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                const proxyUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(targetUrl);

                const res = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemInstruction: { parts: [{ text: DEFAULT_SYSTEM_PROMPT }] },
                        contents: [{ role: 'user', parts: [{ text: prompt }] }]
                    })
                });

                const data = await res.json();
                if(!res.ok) throw new Error(data.error?.message || 'API yanıt vermedi.');

                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if(!text) throw new Error('Yapay zekadan boş yanıt döndü.');

                state.lastRawMarkdown = text;
                document.getElementById('reading-output').innerHTML = marked.parse(text);
                loading.classList.add('hidden');
                result.classList.remove('hidden');
                result.scrollIntoView({ behavior: 'smooth' });
            } catch(err) {
                loading.classList.add('hidden');
                alert('Hata: ' + err.message);
            }
        }

        function copyReading() {
            if(!state.lastRawMarkdown) return;
            navigator.clipboard.writeText(state.lastRawMarkdown);
            alert('Yorum kopyalandı!');
        }
    </script>
